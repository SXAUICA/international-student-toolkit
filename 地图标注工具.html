<!DOCTYPE html>
<!--
  校园地图标注工具 / Campus map tracer
  用途：在底图上人工描出「节点 + 道路」，导出成课设同格式的数据
  用法：双击本文件 → 载入课设数据（可选）→ 用「画路」描主干道 → 导出 JSON
  说明：
    · 坐标存储沿用课设 map_data.js 的约定：x 为横向百分比，y 从底边起算
    · 画面上你点哪里就是哪里（按屏幕位置算），导出时自动换算，可直接替换 map_data.js
    · 进度自动存进浏览器 localStorage，刷新不丢
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>校园地图标注工具</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{ --ink:#111; --yellow:#FFD60A; --pink:#FF4D8D; --sky:#4DA3FF; --green:#35D07F; --bw:2.5px; --sh:3px 3px 0 #111; }
  body{ font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:#FFF8E1; color:var(--ink); padding:14px 16px 40px; }
  h1{font-size:20px;font-weight:900;margin-bottom:4px;}
  .sub{font-size:13px;color:#6B6B6B;margin-bottom:12px;line-height:1.6;}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;}
  button{ font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;background:#fff;color:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:10px;padding:7px 13px;box-shadow:2px 2px 0 var(--ink); }
  button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink);}
  button.on{background:var(--yellow);}
  button.danger{background:var(--pink);color:#fff;}
  button.go{background:var(--green);}
  .sep{width:1px;height:26px;background:#111;opacity:.2;margin:0 4px;}
  select,input[type=number]{ font-family:inherit;font-size:13.5px;font-weight:700;padding:7px 9px;
    border:var(--bw) solid var(--ink);border-radius:10px;background:#fff;box-shadow:2px 2px 0 var(--ink); }
  input[type=number]{width:70px;}
  .hint{ font-size:13.5px;background:#fff;border:var(--bw) solid var(--ink);border-left:8px solid var(--yellow);
    border-radius:12px;box-shadow:var(--sh);padding:10px 14px;margin-bottom:12px;line-height:1.6; }
  .hint b{background:var(--yellow);padding:0 4px;border-radius:4px;}
  .stage{position:relative;border:var(--bw) solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);overflow:hidden;background:#e8edf3;}
  .stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;}
  svg{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;}
  .stats{font-size:13.5px;font-weight:700;margin-top:10px;display:flex;gap:18px;flex-wrap:wrap;}
  .stats span{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:3px 10px;}
  textarea{ width:100%;height:180px;margin-top:12px;font-family:Consolas,monospace;font-size:12px;
    border:var(--bw) solid var(--ink);border-radius:12px;padding:10px;box-shadow:var(--sh);background:#fff; }
</style>
</head>
<body>
<h1>校园地图标注工具</h1>
<div class="sub">
  在底图上描出「节点 + 道路」，导出格式与课设 <code>map_data.js</code> 一致，可直接替换。
  进度自动存在本机浏览器里，刷新不丢。
</div>
<div class="bar">
  <button id="mPoint" class="on">① 加点</button>
  <button id="mRoad">② 画路</button>
  <button id="mMove">③ 移动</button>
  <button id="mErase">④ 删除</button>
  <span class="sep"></span>
  <label style="font-size:13.5px;font-weight:700">道路类型
    <select id="roadType">
      <option value="1">1 人行道</option>
      <option value="2">2 机动车道</option>
      <option value="3" selected>3 人车混合道</option>
    </select>
  </label>
  <span class="sep"></span>
  <button id="finishRoad" class="go">完成这条路</button>
  <button id="undoPt">退一个点</button>
</div>
<div class="bar">
  <button id="loadCourse">载入课设数据（126 点）</button>
  <button id="autoEdge">按道路自动连边</button>
  <button id="expJson">导出 JSON</button>
  <button id="expJs">导出 map_data.js</button>
  <button id="clearAll" class="danger">清空全部</button>
  <span class="sep"></span>
  <label style="font-size:13.5px;font-weight:700">米/像素 <input id="scale" type="number" value="3" step="0.5" min="0.2"></label>
</div>
<div class="hint" id="hint"></div>
<div class="stage">
  <img id="base" src="校园地图底图.jpg" alt="校园底图">
  <svg id="canvas"></svg>
</div>
<div class="stats">
  <span id="stPts">节点 0</span>
  <span id="stRoads">道路 0</span>
  <span id="stEdges">连边 0</span>
</div>
<textarea id="out" spellcheck="false" placeholder="导出结果会出现在这里，可全选复制"></textarea>
<script src="map_data.js"></script>
<script>
(function () {
  'use strict';
  var VW = 1800, VH = 1271;
  var STORE = 'guoxie-map-tracer-v1';
  var HINTS = {
    point: '【加点】在底图上点一下，输入名字。<b>只加留学生真正常用的点</b>：公寓、食堂、图书馆、校医院、快递、超市、校门。',
    road:  '【画路】沿道路一路点下去，描完按「完成这条路」或回车；点错了用「退一个点」。<b>道路是画出来的折线，课设数据里没有</b>，这是这步的主要工作。',
    move:  '【移动】按住节点拖动，修正位置。',
    erase: '【删除】点节点删节点；点道路上的蓝线删整条路。'
  };
  var state = { pts: [], edges: [], roads: [], mode: 'point', seq: 1, draft: null };
  var img = document.getElementById('base');
  var svg = document.getElementById('canvas');
  var out = document.getElementById('out');
  var hint = document.getElementById('hint');

  function toPx(p) { return [p.x / 100 * VW, (100 - p.y) / 100 * VH]; }
  function fromPx(px, py) { return { x: px / VW * 100, y: 100 - py / VH * 100 }; }
  function esc(t) { return String(t).replace(/[<>&]/g, function (m) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[m]; }); }
  function byId(id) { for (var i = 0; i < state.pts.length; i++) if (state.pts[i].id === id) return state.pts[i]; return null; }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify({ pts: state.pts, edges: state.edges, roads: state.roads, seq: state.seq })); } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(STORE);
      if (!raw) return false;
      var d = JSON.parse(raw);
      state.pts = d.pts || []; state.edges = d.edges || []; state.roads = d.roads || []; state.seq = d.seq || 1;
      return (state.pts.length + state.roads.length) > 0;
    } catch (e) { return false; }
  }

  function render() {
    var s = '', i, p, q, r;
    for (i = 0; i < state.roads.length; i++) {
      var pts = state.roads[i].pts.map(function (c) {
        var px = toPx({ x: c[0], y: c[1] });
        return px[0].toFixed(1) + ',' + px[1].toFixed(1);
      }).join(' ');
      s += '<polyline points="' + pts + '" fill="none" stroke="#111" stroke-width="7" stroke-opacity=".16" stroke-linecap="round" stroke-linejoin="round"/>';
      s += '<polyline points="' + pts + '" fill="none" stroke="#4DA3FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-road="' + i + '"/>';
    }
    if (state.draft && state.draft.length) {
      var dp = state.draft.map(function (c) { return c[0].toFixed(1) + ',' + c[1].toFixed(1); }).join(' ');
      s += '<polyline points="' + dp + '" fill="none" stroke="#FF4D8D" stroke-width="3.5" stroke-dasharray="9 5" stroke-linecap="round"/>';
      for (i = 0; i < state.draft.length; i++) {
        s += '<circle cx="' + state.draft[i][0] + '" cy="' + state.draft[i][1] + '" r="5" fill="#FF4D8D" stroke="#111" stroke-width="2"/>';
      }
    }
    for (i = 0; i < state.edges.length; i++) {
      p = byId(state.edges[i].v1); q = byId(state.edges[i].v2);
      if (!p || !q) continue;
      var a = toPx(p), b = toPx(q);
      s += '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) +
           '" stroke="#35D07F" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity=".9"/>';
    }
    for (i = 0; i < state.pts.length; i++) {
      p = state.pts[i];
      var c2 = toPx(p);
      s += '<circle class="node" data-node="' + p.id + '" cx="' + c2[0].toFixed(1) + '" cy="' + c2[1].toFixed(1) + '" r="9" fill="#FFD60A" stroke="#111" stroke-width="2.5"/>';
      s += '<text x="' + (c2[0] + 13).toFixed(1) + '" y="' + (c2[1] + 5).toFixed(1) +
           '" font-size="15" font-weight="700" fill="#111" stroke="#FFFDF6" stroke-width="3.5" paint-order="stroke">' + esc(p.name) + '</text>';
    }
    svg.setAttribute('viewBox', '0 0 ' + VW + ' ' + VH);
    svg.innerHTML = s;
    document.getElementById('stPts').textContent = '节点 ' + state.pts.length;
    document.getElementById('stRoads').textContent = '道路 ' + state.roads.length;
    document.getElementById('stEdges').textContent = '连边 ' + state.edges.length;
    hint.innerHTML = HINTS[state.mode];
  }

  function pxFromEvent(e) {
    var r = svg.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * VW, (e.clientY - r.top) / r.height * VH];
  }

  var drag = null;
  svg.addEventListener('mousedown', function (e) {
    var t = e.target, c = pxFromEvent(e);
    if (state.mode === 'move' && t.classList && t.classList.contains('node')) {
      drag = parseInt(t.getAttribute('data-node'), 10); return;
    }
    if (state.mode === 'erase') {
      if (t.classList && t.classList.contains('node')) {
        var id = parseInt(t.getAttribute('data-node'), 10);
        state.pts = state.pts.filter(function (x) { return x.id !== id; });
        state.edges = state.edges.filter(function (x) { return x.v1 !== id && x.v2 !== id; });
        save(); render();
      } else if (t.getAttribute && t.getAttribute('data-road') !== null) {
        state.roads.splice(parseInt(t.getAttribute('data-road'), 10), 1);
        save(); render();
      }
      return;
    }
    if (state.mode === 'point') {
      var name = prompt('这个点叫什么？（中文名）');
      if (!name) return;
      var q = fromPx(c[0], c[1]);
      state.pts.push({ id: state.seq++, name: name, code: '', x: +q.x.toFixed(2), y: +q.y.toFixed(2) });
      save(); render(); return;
    }
    if (state.mode === 'road') {
      if (!state.draft) state.draft = [];
      state.draft.push([+c[0].toFixed(1), +c[1].toFixed(1)]);
      render();
    }
  });
  svg.addEventListener('mousemove', function (e) {
    if (drag === null) return;
    var p = byId(drag); if (!p) return;
    var c = pxFromEvent(e), q = fromPx(c[0], c[1]);
    p.x = +q.x.toFixed(2); p.y = +q.y.toFixed(2);
    render();
  });
  document.addEventListener('mouseup', function () { if (drag !== null) { drag = null; save(); } });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && state.draft) { e.preventDefault(); finishRoad(); }
    else if (e.key === 'Escape' && state.draft) { state.draft = null; render(); }
    else if (e.key === 'Backspace' && state.draft && state.draft.length) { e.preventDefault(); state.draft.pop(); render(); }
  });

  function finishRoad() {
    if (!state.draft || state.draft.length < 2) { state.draft = null; render(); return; }
    var name = prompt('这条路的名称（可留空）', '') || '';
    var conv = state.draft.map(function (c) { var q = fromPx(c[0], c[1]); return [+q.x.toFixed(2), +q.y.toFixed(2)]; });
    state.roads.push({ name: name, type: +document.getElementById('roadType').value, pts: conv });
    state.draft = null; save(); render();
  }

  function autoEdges() {
    var scale = parseFloat(document.getElementById('scale').value) || 3;
    var TH = 26, pairs = {}, added = 0, i;
    state.roads.forEach(function (road) {
      var poly = road.pts.map(function (c) { return toPx({ x: c[0], y: c[1] }); });
      var acc = [0];
      for (i = 1; i < poly.length; i++) acc.push(acc[i - 1] + Math.hypot(poly[i][0] - poly[i - 1][0], poly[i][1] - poly[i - 1][1]));
      var hits = [];
      state.pts.forEach(function (p) {
        var c = toPx(p), best = { d: 1e9, s: 0 };
        for (i = 1; i < poly.length; i++) {
          var ax = poly[i - 1][0], ay = poly[i - 1][1], bx = poly[i][0], by = poly[i][1];
          var dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1;
          var t = Math.max(0, Math.min(1, ((c[0] - ax) * dx + (c[1] - ay) * dy) / L2));
          var qx = ax + t * dx, qy = ay + t * dy, d = Math.hypot(c[0] - qx, c[1] - qy);
          if (d < best.d) best = { d: d, s: acc[i - 1] + t * Math.sqrt(L2) };
        }
        if (best.d <= TH) hits.push({ id: p.id, s: best.s });
      });
      hits.sort(function (a, b) { return a.s - b.s; });
      for (i = 1; i < hits.length; i++) {
        var a2 = Math.min(hits[i - 1].id, hits[i].id), b2 = Math.max(hits[i - 1].id, hits[i].id);
        var key = a2 + '-' + b2;
        if (pairs[key]) continue;
        pairs[key] = 1;
        var pa = toPx(byId(a2)), pb = toPx(byId(b2));
        state.edges.push({ v1: a2, v2: b2, weight: Math.max(1, Math.round(Math.hypot(pb[0] - pa[0], pb[1] - pa[1]) / scale)), road_type: road.type || 3 });
        added++;
      }
    });
    save(); render();
    alert(added ? ('自动生成 ' + added + ' 条连边。') : '没找到能连的节点：先画路，并确认节点离道路不超过容差（约 26 像素）。');
  }

  function loadCourse() {
    if (typeof MAP_VERTICES === 'undefined') { alert('没找到 map_data.js，请确认它和本工具在同一目录。'); return; }
    if (state.pts.length && !confirm('会覆盖当前的节点和连边，继续？')) return;
    state.pts = MAP_VERTICES.map(function (v) { return { id: v.id, name: v.name, code: v.code || '', x: v.x, y: v.y }; });
    state.edges = (typeof MAP_EDGES !== 'undefined' ? MAP_EDGES : []).map(function (e) {
      return { v1: e.v1, v2: e.v2, weight: e.weight, road_type: e.road_type };
    });
    state.seq = Math.max.apply(null, state.pts.map(function (p) { return p.id; })) + 1;
    save(); render();
  }

  function exportJson() {
    out.value = JSON.stringify({ vertices: state.pts, edges: state.edges, roads: state.roads }, null, 1);
  }
  function exportJs() {
    var v = state.pts.map(function (p) {
      return '  {id:' + p.id + ',name:"' + p.name + '",code:"' + (p.code || '') + '",x:' + p.x + ',y:' + p.y + ',source:"manual"}';
    }).join(',\n');
    var e = state.edges.map(function (x) {
      return '  {v1:' + x.v1 + ',v2:' + x.v2 + ',weight:' + x.weight + ',road_type:' + x.road_type + '}';
    }).join(',\n');
    var r = state.roads.map(function (x) {
      return '  {name:"' + x.name + '",type:' + x.type + ',pts:' + JSON.stringify(x.pts) + '}';
    }).join(',\n');
    out.value = '/* 地图标注工具导出，可直接替换 wasm/js/map_data.js */\n' +
      '/* ' + state.pts.length + ' 点, ' + state.edges.length + ' 边, ' + state.roads.length + ' 条道路 */\n\n' +
      'const MAP_VERTICES = [\n' + v + '\n];\n\n' +
      'const MAP_EDGES = [\n' + e + '\n];\n\n' +
      'const MAP_ROADS = [\n' + r + '\n];\n';
  }

  var modeBtns = { point: 'mPoint', road: 'mRoad', move: 'mMove', erase: 'mErase' };
  Object.keys(modeBtns).forEach(function (m) {
    document.getElementById(modeBtns[m]).addEventListener('click', function () {
      state.mode = m; state.draft = null;
      Object.keys(modeBtns).forEach(function (k) { document.getElementById(modeBtns[k]).classList.toggle('on', k === m); });
      render();
    });
  });
  document.getElementById('finishRoad').addEventListener('click', finishRoad);
  document.getElementById('undoPt').addEventListener('click', function () { if (state.draft && state.draft.length) { state.draft.pop(); render(); } });
  document.getElementById('loadCourse').addEventListener('click', loadCourse);
  document.getElementById('autoEdge').addEventListener('click', autoEdges);
  document.getElementById('expJson').addEventListener('click', exportJson);
  document.getElementById('expJs').addEventListener('click', exportJs);
  document.getElementById('clearAll').addEventListener('click', function () {
    if (!confirm('清空所有节点、道路和连边？不能撤销。')) return;
    state.pts = []; state.edges = []; state.roads = []; state.seq = 1; state.draft = null;
    save(); render();
  });

  function boot() {
    if (img.naturalWidth) { VW = img.naturalWidth; VH = img.naturalHeight; }
    if (!load() && typeof MAP_VERTICES !== 'undefined') loadCourse();
    render();
  }
  if (img.complete) boot(); else img.addEventListener('load', boot);
})();
</script>
</body>
</html>
